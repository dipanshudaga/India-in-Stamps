name: IndiaInStampsDesign2
options:
  bundleIdPrefix: com.dipanshudaga
  deploymentTarget:
    iOS: "26.0"
targets:
  IndiaInStampsDesign2:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/App
      - path: Sources/DesignSystem
      - path: Sources/Models
      - path: Sources/Data
      - path: Sources/Views
      - path: Sources/Resources/StampsEnriched.csv
      - path: Sources/Resources/StampImagesClean
        type: folder
        buildPhase: resources
      - path: Sources/Resources/Assets.xcassets
    settings:
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: "Stamps (Design 2)"
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
      PRODUCT_BUNDLE_IDENTIFIER: com.dipanshudaga.IndiaInStamps.design2
      TARGETED_DEVICE_FAMILY: "1"
      SWIFT_VERSION: "6.0"
      IPHONEOS_DEPLOYMENT_TARGET: "26.0"
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: FSQA5JT668
      ASSETCATALOG_COMPILER_APPICON_NAME: ""
